services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ivolve-app:latest
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-ivolve_user}
      DB_PASSWORD: ${DB_PASSWORD:-ivolve_pass_123}
      DB_NAME: ivolve
    volumes:
      - app_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ivolve-net

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass_123}
      MYSQL_DATABASE: ivolve
      MYSQL_USER: ${DB_USER:-ivolve_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ivolve_pass_123}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - ivolve-net

networks:
  ivolve-net:
    name: ivolve-net
    driver: bridge

volumes:
  app_logs:
  db_data:
